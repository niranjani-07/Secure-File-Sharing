<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVault | Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #020b20;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        /* MAIN CONTAINER */

        .main {
            width: 1100px;
            height: 650px;

            display: grid;
            grid-template-columns: 50% 50%;

            overflow: hidden;

            border-radius: 22px;

            background: #07142d;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55);
        }


        /* =========================
           LEFT SIDE - IMAGE ONLY
        ========================= */

        .visual {
            width: 100%;
            height: 650px;

            background-image: url(
                "{{ url_for('static', filename='vault-bg.jpeg') }}"
            );

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }


        /* =========================
           RIGHT SIDE - FORM
        ========================= */

        .form-section {
            width: 100%;
            height: 650px;

            padding: 55px 55px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background: #07142d;
        }


        /* LOGO */

        .logo {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #08b9ff,
                #315cff
            );

            font-size: 26px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 25px rgba(8, 185, 255, 0.20);
        }


        /* HEADING */

        h1 {
            color: #ffffff;

            font-size: 31px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #8ea2c1;

            font-size: 14px;

            margin-bottom: 28px;
        }


        /* ERROR / FLASH MESSAGE */

        .message {
            padding: 11px 13px;

            margin-bottom: 18px;

            border-radius: 8px;

            background: rgba(239, 68, 68, 0.12);

            border: 1px solid rgba(239, 68, 68, 0.25);

            color: #ff9b9b;

            font-size: 13px;
        }


        /* FIELD */

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            color: #dce7f7;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        /* INPUT */

        .field input {
            width: 100%;

            height: 46px;

            padding: 0 14px;

            background: #0b1b36;

            border: 1px solid #263e62;

            border-radius: 9px;

            color: #ffffff;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .field input::placeholder {
            color: #627693;
        }

        .field input:focus {
            border-color: #13bff5;

            box-shadow:
                0 0 0 3px rgba(19, 191, 245, 0.10);
        }


        /* BUTTON */

        .register-btn {
            width: 100%;

            height: 48px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #08b9ff,
                    #315cff
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(49, 92, 255, 0.25);
        }


        /* LOGIN LINK */

        .login {
            text-align: center;

            margin-top: 22px;

            color: #7185a3;

            font-size: 13px;
        }

        .login a {
            color: #28c7ff;

            text-decoration: none;

            font-weight: 600;
        }

        .login a:hover {
            text-decoration: underline;
        }


        /* SECURITY */

        .security {
            text-align: center;

            margin-top: 22px;

            color: #526987;

            font-size: 11px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            body {
                padding: 15px;
            }

            .main {
                width: 100%;
                max-width: 500px;

                height: auto;

                grid-template-columns: 1fr;
            }

            .visual {
                display: none;
            }

            .form-section {
                height: auto;

                min-height: 600px;

                padding: 40px 30px;
            }
        }

    </style>

</head>


<body>


<div class="main">


    <!-- =================================
         LEFT : LOCK IMAGE ONLY
    ================================== -->

    <div class="visual"></div>


    <!-- =================================
         RIGHT : REGISTER FORM
    ================================== -->

    <div class="form-section">


        <!-- ICON -->

        <div class="logo">
            🔐
        </div>


        <!-- TITLE -->

        <h1>
            Create your account
        </h1>


        <p class="subtitle">
            Join SecureVault and share files securely.
        </p>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- REGISTER FORM -->

        <form method="POST">


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Secure Account →
            </button>


        </form>


        <!-- LOGIN -->

        <div class="login">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>


        <!-- SECURITY -->

        <div class="security">

            🔒 Your credentials are securely protected

        </div>


    </div>

</div>


</body>

</html>
